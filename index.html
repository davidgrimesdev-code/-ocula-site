<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ocula</title>
  <meta name="description" content="Ocula helps you track your contact lens replacement cycle, wear history, supply, and prescription information.">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f7ff;
      color: #111827;
      line-height: 1.6;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 80px 24px;
    }

    .hero {
      text-align: center;
      padding: 60px 20px;
    }

    .icon {
      width: 96px;
      height: 96px;
      margin: 0 auto 24px;
      border-radius: 50%;
      background: radial-gradient(circle at center, #ffffff 0%, #dfe7ff 45%, #aebeff 100%);
      box-shadow: 0 12px 40px rgba(64, 94, 255, 0.18);
    }

    .badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 999px;
      background: #e8edff;
      color: #3f5cff;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.5px;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 48px;
      margin: 0 0 12px;
      letter-spacing: -1.5px;
    }

    .subtitle {
      font-size: 20px;
      color: #778197;
      max-width: 540px;
      margin: 0 auto;
    }

    .card {
      background: white;
      border-radius: 24px;
      padding: 28px;
      margin-top: 36px;
      box-shadow: 0 8px 30px rgba(36, 52, 90, 0.06);
      border: 1px solid #edf0f7;
    }

    .links {
      display: grid;
      gap: 14px;
    }

    .links a {
      display: block;
      padding: 17px 20px;
      border-radius: 14px;
      background: #f7f9ff;
      color: #2547f5;
      text-decoration: none;
      font-weight: 600;
    }

    .links a:hover {
      background: #edf1ff;
    }

    footer {
      text-align: center;
      margin-top: 50px;
      color: #9aa3b5;
      font-size: 14px;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #10131c;
        color: #f5f7fb;
      }

      .card {
        background: #1b202b;
        border-color: #272e3c;
      }

      .links a {
        background: #222938;
        color: #7690ff;
      }

      .subtitle {
        color: #9da7ba;
      }

      footer {
        color: #7f899b;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <section class="hero">
      <div class="icon"></div>
      <div class="badge">OCULA</div>

      <h1>Simpler lens care.</h1>

      <p class="subtitle">
        Track your contact lens cycle, wear history, supply, and prescription information in one simple place.
      </p>
    </section>

    <section class="card">
      <h2>Ocula Resources</h2>

      <div class="links">
        <a href="privacy.html">Privacy Policy</a>
        <a href="terms.html">Terms of Use</a>
        <a href="support.html">Support</a>
      </div>
    </section>

    <footer>
      © 2026 Ocula. All rights reserved.
    </footer>

  </main>
</body>
</html>
