<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Support — Ocula</title>

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f7ff;
      color: #111827;
      line-height: 1.6;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      padding: 70px 24px;
    }

    .card {
      background: white;
      border-radius: 24px;
      padding: 36px;
      border: 1px solid #edf0f7;
      box-shadow: 0 8px 30px rgba(36, 52, 90, 0.05);
    }

    h1 {
      font-size: 40px;
      margin-top: 0;
    }

    p {
      color: #667188;
    }

    a {
      color: #3557f6;
      text-decoration: none;
      font-weight: 600;
    }

    .button {
      display: inline-block;
      margin-top: 16px;
      padding: 14px 22px;
      background: #3f5cff;
      color: white;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 700;
    }

    .links {
      margin-top: 40px;
      padding-top: 24px;
      border-top: 1px solid #edf0f7;
    }

    .links a {
      margin-right: 18px;
      font-weight: 500;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #10131c;
        color: #f5f7fb;
      }

      .card {
        background: #1b202b;
        border-color: #272e3c;
      }

      p {
        color: #9da7ba;
      }

      .links {
        border-color: #272e3c;
      }

      a {
        color: #7890ff;
      }

      .button {
        color: white;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <section class="card">

      <h1>Ocula Support</h1>

      <p>
        Need help with Ocula, found a bug, or have a suggestion?
      </p>

      <p>
        Send an email and include as much information as possible about the issue you're experiencing.
      </p>

     <a class="button" href="mailto:davidgrimesdev@gmail.com?subject=Ocula%20Support">
  Contact Support
</a>

      <div class="links">
        <a href="index.html">Ocula</a>
        <a href="privacy.html">Privacy Policy</a>
        <a href="terms.html">Terms of Use</a>
      </div>

    </section>

  </main>
</body>
</html>
